<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="src/assets/profile.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rathana Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kaushan+Script&family=Montserrat:wght@800;900&family=Poppins:wght@400;500;600;700;800;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script>
      // Apply theme immediately before any rendering to prevent flash
      (function() {
        var savedTheme = localStorage.getItem('theme');
        var theme = savedTheme || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <style>
      /* Initial theme to prevent flicker */
      html[data-theme="dark"] {
        --primary-color: #0f172a;
        --primary-dark: #1e293b;
        --text-color: #cbd5e1;
        --text-dark: #cbd5e1;
        --accent-color: #ff5419;
        --accent-light: #ff8c42;
        --bg-hover: #1e293b;
        --border-color: rgba(255, 255, 255, 0.1);
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        --card-bg: linear-gradient(180deg, rgba(15, 23, 42, 0.92) 0%, rgba(30, 41, 59, 0.95) 100%);
        --card-shadow: 0 14px 32px rgba(5, 10, 20, 0.3);
        --badge-bg: #1e293b;
        --glass-bg: rgba(255, 255, 255, 0.05);
        --glass-hover: rgba(255, 255, 255, 0.08);
        --input-bg: rgba(255, 255, 255, 0.05);
        --footer-bg: linear-gradient(135deg, #050a15 0%, #0a1020 100%);
      }
      
      html[data-theme="light"] {
        --primary-color: #f8fafc;
        --primary-dark: #ffffff;
        --text-color: #0f172a;
        --text-dark: #475569;
        --accent-color: #ff5419;
        --accent-light: #ff8c42;
        --bg-hover: #f1f5f9;
        --border-color: rgba(0, 0, 0, 0.08);
        --shadow: 0 4px 12px -1px rgba(0, 0, 0, 0.06);
        --card-bg: #ffffff;
        --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        --badge-bg: #e2e8f0;
        --glass-bg: rgba(255, 255, 255, 0.8);
        --glass-hover: rgba(255, 255, 255, 0.95);
        --input-bg: #f8fafc;
        --footer-bg: linear-gradient(135deg, #f1f5f9 0%, #ffffff 100%);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
